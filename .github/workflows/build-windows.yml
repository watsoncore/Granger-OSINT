name: Build Granger-OSINT for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test React frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Install dependencies
        run: python -m pip install --no-compile -r requirements-dev.txt
      - name: Verify character assets
        run: python scripts/verify_assets.py
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Build and verify canonical executable (external tool catalog only)
        # External vendor/toolenv directories are intentionally absent from Git.
        # Their actual availability is reported; no external tool success is claimed.
        run: python scripts/build_release.py --allow-missing-external-tools
      - uses: actions/upload-artifact@v4
        with:
          name: Granger-OSINT-Windows-x64
          path: |
            dist/Granger-OSINT.exe
          if-no-files-found: error
