name: Build Granger-OSINT for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test React frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify character assets
        run: python scripts/verify_assets.py
      - name: Test
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean Granger-OSINT.spec
      - name: Smoke test standalone native executable
        run: python scripts/smoke_exe.py --output dist/binarysmoke.json
      - name: Record checksum
        shell: pwsh
        run: |
          (Get-FileHash -LiteralPath dist/Granger-OSINT.exe -Algorithm SHA256).Hash + '  Granger-OSINT.exe' | Set-Content -LiteralPath dist/Granger-OSINT.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Granger-OSINT-Windows-x64
          path: |
            dist/Granger-OSINT.exe
            dist/Granger-OSINT.sha256
            dist/binarysmoke.json
            README.md
          if-no-files-found: error
